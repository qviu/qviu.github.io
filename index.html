<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOKO.INFO - Cek Harga Barang</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 antialiased">

    <!-- Navbar -->
    <nav class="bg-blue-600 text-white shadow-sm sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="text-xl font-black tracking-tight">TOKO.INFO</span>
                <span class="hidden sm:inline text-sm text-blue-100 border-l border-blue-400 pl-3">Katalog Harga Suku Cadang</span>
            </div>
            <div>
                <a class="bg-red-500 hover:bg-red-600 text-white text-xs font-semibold px-4 py-2 rounded-full transition shadow-sm" href="https://buy.id">
                    buy.id
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto px-4 py-10">
        
        <!-- Search Box Container -->
        <div class="bg-white p-6 sm:p-8 rounded-2xl border border-slate-200/80 shadow-sm backdrop-blur-sm">
            <form id="searchForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">
                        Masukkan Kode atau Nama Barang (Bisa banyak baris):
                    </label>
                    <textarea 
                        autofocus 
                        class="w-full min-h-[150px] p-4 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition resize-y placeholder:text-slate-400"
                        id="keyword" 
                        name="keyword" 
                        placeholder="Contoh:&#10;BELT TIMING&#10;D31250-52040-000"></textarea>
                </div>
                
                <div class="flex flex-col sm:flex-row justify-center items-center gap-3 pt-2">
                    <button class="w-full sm:w-auto px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm rounded-xl transition shadow-sm" type="submit">
                        Cek Harga
                    </button>
                    <button class="w-full sm:w-auto px-6 py-2.5 bg-blue-50 hover:bg-blue-100 text-blue-600 font-medium text-sm rounded-xl transition" type="button" onclick="cetakHasil()">
                        Cetak Daftar
                    </button>
                </div>
            </form>
        </div>

        <!-- Results Area -->
        <div id="results" class="mt-8"></div>

    </main>

<script>
let lastHasilPencarian = [];
let cachedDataBarang = null;

document.getElementById('searchForm').addEventListener('submit', async function(event) {
    event.preventDefault();
    const keyword = document.getElementById('keyword').value;
    if (!keyword.trim()) return;
    await cariHargaBarang(keyword.split('\n'));
});

function parseMetaDariNamaFile(fileName) {
    const cleanName = fileName.replace('.json', '');
    const parts = cleanName.split('_');
    
    let tanggalBerlaku = '-';
    let namaMerek = cleanName.toUpperCase();

    if (parts.length >= 2) {
        const dateStr = parts[0];
        namaMerek = parts.slice(1).join(' ').replace(/-/g, ' ').toUpperCase();

        if (dateStr.length === 6) {
            const tahun = "20" + dateStr.substring(0, 2);
            const bulanNum = dateStr.substring(2, 4);
            const hari = dateStr.substring(4, 6);
            
            const namaBulan = [
                "Januari", "Februari", "Maret", "April", "Mei", "Juni", 
                "Juli", "Agustus", "September", "Oktober", "November", "Desember"
            ];
            
            const indexBulan = parseInt(bulanNum, 10) - 1;
            if (indexBulan >= 0 && indexBulan < 12) {
                tanggalBerlaku = `${hari} ${namaBulan[indexBulan]} ${tahun}`;
            }
        }
    }
    
    return { merek: namaMerek, berlaku: tanggalBerlaku };
}

async function getDataBarang() {
    if (cachedDataBarang) return cachedDataBarang;

    const folderPath = 'data/';
    let dataBarang = [];

    try {
        const resFiles = await fetch(folderPath + 'files.json');
        if (!resFiles.ok) throw new Error('Gagal memuat daftar files.json');
        const fileNames = await resFiles.json();

        for (const fileName of fileNames) {
            try {
                const response = await fetch(folderPath + fileName);
                if (!response.ok) continue;

                const data = await response.json();
                const meta = parseMetaDariNamaFile(fileName);

                if (Array.isArray(data)) {
                    const standardizedData = data.map(item => {
                        const kode = item.kode || item.Kode || item.KODE || '-';
                        const nama = item.nama || item.Nama || item.NAMA || '-';
                        
                        let hargaMentah = item.harga || item.Harga || item.HARGA || 0;
                        if (typeof hargaMentah === 'string') {
                            hargaMentah = hargaMentah.replace(/[^0-9]/g, '');
                        }
                        const harga = Number(hargaMentah) || 0;

                        return { kode, nama, harga, merek: meta.merek, berlaku: meta.berlaku };
                    });
                    dataBarang = dataBarang.concat(standardizedData);
                }
            } catch (err) {
                console.error('Error membaca file:', fileName, err);
            }
        }
    } catch (globalErr) {
        console.error('Katalog Utama Error:', globalErr);
    }

    cachedDataBarang = dataBarang;
    return dataBarang;
}

function normalizeText(text) {
    return String(text || '').replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
}

async function cariHargaBarang(keywords) {
    const resultsDiv = document.getElementById('results');
    resultsDiv.innerHTML = `
        <div class="flex flex-col items-center justify-center p-8 text-blue-600 font-medium">
            <svg class="animate-spin h-8 w-8 mb-3 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" diagnostic="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Mencari data barang...
        </div>`;

    const dataBarang = await getDataBarang();
    const hasilPencarian = [];

    keywords = keywords.map(keyword => normalizeText(keyword.trim())).filter(keyword => keyword !== '');

    for (const keyword of keywords) {
        for (const barang of dataBarang) {
            const kodeBarang = normalizeText(barang.kode);
            const namaBarang = normalizeText(barang.nama);
            if (kodeBarang.includes(keyword) || namaBarang.includes(keyword)) {
                hasilPencarian.push(barang);
            }
        }
    }

    const uniqueResults = [];
    const seen = new Set();
    for (const item of hasilPencarian) {
        const key = `${normalizeText(item.kode)}-${normalizeText(item.nama)}`;
        if (!seen.has(key)) { seen.add(key); uniqueResults.push(item); }
    }

    lastHasilPencarian = uniqueResults;
    tampilkanHasilPencarian(uniqueResults);
}

function tampilkanHasilPencarian(hasilPencarian) {
    const resultsDiv = document.getElementById('results');
    resultsDiv.innerHTML = '';

    if (!hasilPencarian.length) {
        resultsDiv.innerHTML = `
            <div class="text-center text-slate-500 bg-white border border-slate-200 rounded-2xl p-8 shadow-sm">
                Barang tidak ditemukan. Silakan periksa kembali kata kunci Anda.
            </div>`;
        return;
    }

    const cardContainer = document.createElement('div');
    cardContainer.className = 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5';

    hasilPencarian.forEach(barang => {
        const card = document.createElement('div');
        card.className = 'bg-white border border-slate-200 rounded-xl p-5 shadow-sm hover:shadow-md hover:-translate-y-0.5 hover:border-blue-200 transition-all duration-200 flex flex-col justify-between';

        card.innerHTML = `
            <div>
                <div class="text-xs font-bold text-slate-400 tracking-wider uppercase mb-1">${barang.kode}</div>
                <div class="text-base font-semibold text-slate-800 leading-snug mb-3">${barang.nama}</div>
            </div>
            <div class="mt-4 pt-3 border-t border-slate-100">
                <div class="text-xl font-bold text-slate-900">${new Intl.NumberFormat('id-ID').format(barang.harga)}</div>
                <div class="text-[11px] text-slate-400 mt-1 italic">Mulai Berlaku: ${barang.berlaku}</div>
                <div class="mt-2.5">
                    <span class="inline-block bg-blue-50 text-blue-600 text-[10px] font-bold px-2.5 py-1 rounded-md tracking-wide uppercase">${barang.merek}</span>
                </div>
            </div>
        `;

        cardContainer.appendChild(card);
    });

    resultsDiv.appendChild(cardContainer);
}

function cetakHasil() {
    if (!lastHasilPencarian.length) { alert('Tidak ada data untuk dicetak'); return; }

    let tableHTML = `
        <table border="1" cellspacing="0" cellpadding="8" style="width:100%; border-collapse:collapse; font-family: sans-serif;">
            <thead>
                <tr style="background-color: #2563eb; color: white;">
                    <th>No</th><th>Kode Barang</th><th>Nama Barang</th><th>Merek</th><th>Harga</th><th>Mulai Berlaku</th>
                </tr>
            </thead>
            <tbody>
    `;

    lastHasilPencarian.forEach((barang, index) => {
        tableHTML += `
            <tr style="background-color: ${index % 2 === 0 ? '#ffffff' : '#f8fafc'};">
                <td style="text-align: center;">${index + 1}</td>
                <td style="font-weight: bold;">${barang.kode}</td>
                <td>${barang.nama}</td>
                <td><span style="background: #eff6ff; color: #2563eb; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold;">${barang.merek}</span></td>
                <td style="text-align: right; font-weight: bold;">${new Intl.NumberFormat('id-ID').format(barang.harga)}</td>
                <td style="text-align: center; color: #64748b;">${barang.berlaku}</td>
            </tr>
        `;
    });

    tableHTML += `</tbody></table>`;

    const win = window.open('', '', 'width=900,height=700');
    win.document.write(`
        <html>
        <head>
            <title>TOKO.INFO - Cetak Daftar</title>
            <style>
                body { font-family: Arial, sans-serif; padding: 30px; color: #1e293b; }
                h2 { text-align: center; color: #2563eb; margin-bottom: 25px; }
                table { font-size: 13px; width: 100%; }
                th, td { border: 1px solid #e2e8f0; }
                th { padding: 12px; }
            </style>
        </head>
        <body><h2>Daftar Harga Suku Cadang</h2>${tableHTML}</body>
        </html>
    `);
    win.document.close();
    win.print();
}
</script>
</body>
</html>
