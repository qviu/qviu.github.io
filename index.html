<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOKO.INFO - Cek Harga Barang</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.3/css/bulma.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { background-color: #f4f7f9; font-family: 'Inter', sans-serif; }
        .navbar.is-soft-blue { background-color: #4a90e2; color: white; }
        .navbar.is-soft-blue .navbar-item { color: white; font-weight: 500; }
        .container { background-color: transparent; padding: 10px; max-width: 1000px !important; }
        .search-box-container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 12px rgba(74, 144, 226, 0.08); border: 1px solid #e1e8ed; }
        .card-container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: flex-start; margin-top: 25px; }
        .card { background-color: white; border: 1px solid #e1e8ed; border-radius: 10px; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02); transition: transform 0.2s, box-shadow 0.2s; flex: 1 1 calc(33.333% - 20px); max-width: calc(33.333% - 20px); display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(74, 144, 226, 0.12); border-color: #bfd7ff; }
        .card-content { padding: 20px; display: flex; flex-direction: column; height: 100%; }
        .part-code { font-size: 0.85rem; color: #7f8c8d; font-weight: 600; letter-spacing: 0.5px; margin-bottom: 5px; }
        .part-name { font-weight: 600; color: #2c3e50; font-size: 1.1rem; line-height: 1.4; margin-bottom: 15px; flex-grow: 1; }
        .info-row { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid #f0f4f8; margin-top: auto; }
        .part-brand { font-size: 0.8rem; font-weight: 600; background-color: #e6f0fa; color: #4a90e2; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; }
        .part-price { font-size: 1.25rem; font-weight: 700; color: #2d3748; margin-top: 10px; }
        .part-date { font-size: 0.75rem; color: #95a5a6; margin-top: 5px; font-style: italic; }
        .textarea { border-radius: 8px; border: 1.5px solid #dcdde1; transition: border-color 0.3s; font-family: inherit; }
        .textarea:focus { border-color: #4a90e2; box-shadow: 0 0 0 0.125rem rgba(74, 144, 226, 0.25); }
        .button.is-soft-blue { background-color: #4a90e2; color: white; font-weight: 500; border-radius: 8px; }
        .button.is-soft-blue:hover { background-color: #357abd; color: white; }
        .button.is-light-blue { background-color: #e6f0fa; color: #4a90e2; font-weight: 500; border-radius: 8px; }
        .button.is-light-blue:hover { background-color: #d2e4f7; color: #357abd; }
        @media screen and (max-width: 1024px) { .card { flex: 1 1 calc(50% - 20px); max-width: calc(50% - 20px); } }
        @media screen and (max-width: 768px) { .card { flex: 1 1 100%; max-width: 100%; } }
        .section { padding: 40px 10px; }
        .loading { margin-top: 30px; color: #4a90e2; font-weight: 500; }
        .no-results { margin-top: 30px; color: #7f8c8d; background: white; padding: 30px; border-radius: 8px; border: 1px solid #e1e8ed; }
    </style>
</head>

<body>

<nav class="navbar is-soft-blue" role="navigation">
    <div class="navbar-brand"><div class="navbar-item"><strong>TOKO.INFO</strong></div></div>
    <div class="navbar-menu">
        <div class="navbar-start"><div class="navbar-item">Katalog Harga Suku Cadang</div></div>
        <div class="navbar-end"><div class="navbar-item"><a class="button is-danger is-light is-rounded is-small" href="https://buy.id">buy.id</a></div></div>
    </div>
</nav>

<section class="section">
    <div class="container">
        <div class="search-box-container">
            <form id="searchForm">
                <div class="field">
                    <label class="label has-text-left" style="color: #4a5568;">Masukkan Kode atau Nama Barang (Bisa banyak baris):</label>
                    <div class="control">
                        <textarea autofocus class="textarea" id="keyword" name="keyword" rows="6" placeholder="Contoh:&#10;BELT TIMING&#10;D31250-52040-000"></textarea>
                    </div>
                </div>
                <div class="buttons is-centered" style="margin-top:15px;">
                    <button class="button is-soft-blue px-5" type="submit">Cek Harga</button>
                    <button class="button is-light-blue px-5" type="button" onclick="cetakHasil()">Cetak Daftar</button>
                </div>
            </form>
        </div>
        <div id="results"></div>
    </div>
</section>

<script>
let lastHasilPencarian = [];
let cachedDataBarang = null;

document.getElementById('searchForm').addEventListener('submit', async function(event) {
    event.preventDefault();
    const keyword = document.getElementById('keyword').value;
    if (!keyword.trim()) return;
    await cariHargaBarang(keyword.split('\n'));
});

function parseMetaDariNamaFile(fileName) {
    const cleanName = fileName.replace('.json', '');
    const parts = cleanName.split('_');
    
    let tanggalBerlaku = '-';
    let namaMerek = cleanName.toUpperCase();

    if (parts.length >= 2) {
        const dateStr = parts[0];
        namaMerek = parts.slice(1).join(' ').replace(/-/g, ' ').toUpperCase();

        if (dateStr.length === 6) {
            const tahun = "20" + dateStr.substring(0, 2);
            const bulanNum = dateStr.substring(2, 4);
            const hari = dateStr.substring(4, 6);
            
            const namaBulan = [
                "Januari", "Februari", "Maret", "April", "Mei", "Juni", 
                "Juli", "Agustus", "September", "Oktober", "November", "Desember"
            ];
            
            const indexBulan = parseInt(bulanNum, 10) - 1;
            if (indexBulan >= 0 && indexBulan < 12) {
                tanggalBerlaku = `${hari} ${namaBulan[indexBulan]} ${tahun}`;
            }
        }
    }
    
    return { merek: namaMerek, berlaku: tanggalBerlaku };
}

async function getDataBarang() {
    if (cachedDataBarang) return cachedDataBarang;

    const folderPath = 'data/';
    let dataBarang = [];

    try {
        const resFiles = await fetch(folderPath + 'files.json');
        if (!resFiles.ok) throw new Error('Gagal memuat daftar files.json');
        const fileNames = await resFiles.json();

        for (const fileName of fileNames) {
            try {
                const response = await fetch(folderPath + fileName);
                if (!response.ok) continue;

                const data = await response.json();
                const meta = parseMetaDariNamaFile(fileName);

                if (Array.isArray(data)) {
                    const standardizedData = data.map(item => {
                        const kode = item.kode || item.Kode || item.KODE || '-';
                        const nama = item.nama || item.Nama || item.NAMA || '-';
                        
                        let hargaMentah = item.harga || item.Harga || item.HARGA || 0;
                        if (typeof hargaMentah === 'string') {
                            hargaMentah = hargaMentah.replace(/[^0-9]/g, '');
                        }
                        const harga = Number(hargaMentah) || 0;

                        return { 
                            kode, 
                            nama, 
                            merek: meta.merek, 
                            berlaku: meta.berlaku 
                        };
                    });
                    dataBarang = dataBarang.concat(standardizedData);
                }
            } catch (err) {
                console.error('Error membaca file:', fileName, err);
            }
        }
    } catch (globalErr) {
        console.error('Katalog Utama Error:', globalErr);
    }

    cachedDataBarang = dataBarang;
    return dataBarang;
}

function normalizeText(text) {
    return String(text || '').replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
}

async function cariHargaBarang(keywords) {
    const resultsDiv = document.getElementById('results');
    resultsDiv.innerHTML = `<div class="loading"><progress class="progress is-small is-link" max="100">Loading</progress>Mencari data barang...</div>`;

    const dataBarang = await getDataBarang();
    const hasilPencarian = [];

    keywords = keywords.map(keyword => normalizeText(keyword.trim())).filter(keyword => keyword !== '');

    for (const keyword of keywords) {
        for (const barang of dataBarang) {
            const kodeBarang = normalizeText(barang.kode);
            const namaBarang = normalizeText(barang.nama);
            if (kodeBarang.includes(keyword) || namaBarang.includes(keyword)) {
                hasilPencarian.push(barang);
            }
        }
    }

    const uniqueResults = [];
    const seen = new Set();
    for (const item of hasilPencarian) {
        const key = `${normalizeText(item.kode)}-${normalizeText(item.nama)}`;
        if (!seen.has(key)) { seen.add(key); uniqueResults.push(item); }
    }

    lastHasilPencarian = uniqueResults;
    tampilkanHasilPencarian(uniqueResults);
}

function tampilkanHasilPencarian(hasilPencarian) {
    const resultsDiv = document.getElementById('results');
    resultsDiv.innerHTML = '';

    if (!hasilPencarian.length) {
        resultsDiv.innerHTML = '<div class="no-results">Barang tidak ditemukan. Silakan periksa kembali kata kunci Anda.</div>';
        return;
    }

    const cardContainer = document.createElement('div');
    cardContainer.className = 'card-container';

    hasilPencarian.forEach(barang => {
        const card = document.createElement('div');
        card.className = 'card';

        const cardContent = document.createElement('div');
        cardContent.className = 'card-content';

        cardContent.innerHTML = `
            <div class="part-code">${barang.kode}</div>
            <div class="part-name">${barang.nama}</div>
            <div class="part-price">Rp ${new Intl.NumberFormat('id-ID').format(barang.harga)}</div>
            <div class="part-date">Mulai Berlaku: ${barang.berlaku}</div>
            <div class="info-row">
                <span class="part-brand">${barang.merek}</span>
            </div>
        `;

        card.appendChild(cardContent);
        cardContainer.appendChild(card);
    });

    resultsDiv.appendChild(cardContainer);
}

function cetakHasil() {
    if (!lastHasilPencarian.length) { alert('Tidak ada data untuk dicetak'); return; }

    let tableHTML = `
        <table border="1" cellspacing="0" cellpadding="8" style="width:100%; border-collapse:collapse; font-family: sans-serif;">
            <thead>
                <tr style="background-color: #4a90e2; color: white;">
                    <th>No</th><th>Kode Barang</th><th>Nama Barang</th><th>Merek</th><th>Harga</th><th>Mulai Berlaku</th>
                </tr>
            </thead>
            <tbody>
    `;

    lastHasilPencarian.forEach((barang, index) => {
        tableHTML += `
            <tr style="background-color: ${index % 2 === 0 ? '#ffffff' : '#f8fafd'};">
                <td style="text-align: center;">${index + 1}</td>
                <td style="font-weight: bold;">${barang.kode}</td>
                <td>${barang.nama}</td>
                <td><span style="background: #e6f0fa; color: #4a90e2; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold;">${barang.merek}</span></td>
                <td style="text-align: right; font-weight: bold;">Rp ${new Intl.NumberFormat('id-ID').format(barang.harga)}</td>
                <td style="text-align: center; color: #7f8c8d;">${barang.berlaku}</td>
            </tr>
        `;
    });

    tableHTML += `</tbody></table>`;

    const win = window.open('', '', 'width=900,height=700');
    win.document.write(`
        <html>
        <head>
            <title>TOKO.INFO - Cetak Daftar</title>
            <style>
                body { font-family: Arial, sans-serif; padding: 30px; color: #2c3e50; }
                h2 { text-align: center; color: #4a90e2; margin-bottom: 25px; }
                table { font-size: 13px; width: 100%; }
                th, td { border: 1px solid #dcdde1; }
                th { padding: 12px; }
            </style>
        </head>
        <body><h2>Daftar Harga Suku Cadang</h2>${tableHTML}</body>
        </html>
    `);
    win.document.close();
    win.print();
}
</script>
</body>
</html>
